# Decap CMS 後台設定
# 網址: https://profe-elisachang.github.io/chinese-shizi/admin/

site_url: https://profe-elisachang.github.io/chinese-shizi
display_url: https://profe-elisachang.github.io/chinese-shizi

backend:
  name: github
  repo: profe-elisachang/chinese-shizi
  branch: main

media_folder: "assets/uploads"
public_folder: "/chinese-shizi/assets/uploads"

locale: "zh-tw"

slug:
  encoding: "unicode"
  clean_accents: true

collections:
  # ── 成功之路 ──────────────────────────────────────────
  - name: "road-to-success"
    label: "成功之路 · 课程"
    label_singular: "课程"
    folder: "courses/road-to-success/lessons"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    frontmatter_delimiter: ["<!--", "-->"]
    summary: "{{lessonNum}} · {{title}}"
    sortable_fields: ["lessonNum", "title", "book"]
    fields:
      - label: "前台名称"
        name: "title"
        widget: "string"
        hint: "学生在 index 页看到的课名，例如：马丁看中医"

      - label: "文件名"
        name: "slug"
        widget: "string"
        hint: "不含 .html，例如 lesson-03（必须与 GitHub 文件名一致）"
        pattern: ["^lesson-[0-9]{2}$", "格式：lesson-01 到 lesson-36"]

      - label: "册别"
        name: "book"
        widget: "select"
        default: "jinbu-1"
        options:
          - { label: "进步篇 一（第 1–12 课）", value: "jinbu-1" }
          - { label: "进步篇 二（第 13–24 课）", value: "jinbu-2" }
          - { label: "进步篇 三（第 25–36 课）", value: "jinbu-3" }

      - label: "课次"
        name: "lessonNum"
        widget: "number"
        value_type: "int"
        min: 1
        max: 36

      - label: "发布"
        name: "published"
        widget: "boolean"
        default: true
        hint: "取消勾选则不会出现在前台 index"

      - label: "标签"
        name: "tags"
        widget: "string"
        required: false
        default: "课文 · 词语扩展 · 语言点"

      - label: "HTML 内容"
        name: "body"
        widget: "code"
        default_language: "html"
        allow_language_selection: false

  # ── Grammar ───────────────────────────────────────────
  - name: "grammar"
    label: "Grammar"
    label_singular: "Grammar"
    folder: "pages/grammar/content"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    frontmatter_delimiter: ["<!--", "-->"]
    summary: "{{title}}"
    fields:
      - { label: "前台名称", name: "title", widget: "string" }
      - { label: "文件名", name: "slug", widget: "string", hint: "不含 .html，例如 而且" }
      - { label: "发布", name: "published", widget: "boolean", default: true }
      - label: "HTML 内容"
        name: "body"
        widget: "code"
        default_language: "html"

  # ── Extras ────────────────────────────────────────────
  - name: "extras"
    label: "Extras"
    label_singular: "Extras"
    folder: "pages/extras/content"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    frontmatter_delimiter: ["<!--", "-->"]
    summary: "{{title}}"
    fields:
      - { label: "前台名称", name: "title", widget: "string" }
      - { label: "文件名", name: "slug", widget: "string" }
      - { label: "发布", name: "published", widget: "boolean", default: true }
      - label: "HTML 内容"
        name: "body"
        widget: "code"
        default_language: "html"

  # ── Mini Story ────────────────────────────────────────
  - name: "mini-story"
    label: "Mini Story"
    label_singular: "Mini Story"
    folder: "pages/mini-story/content"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    frontmatter_delimiter: ["<!--", "-->"]
    summary: "{{title}}"
    fields:
      - { label: "前台名称", name: "title", widget: "string" }
      - { label: "文件名", name: "slug", widget: "string", hint: "例如 story-16" }
      - { label: "发布", name: "published", widget: "boolean", default: true }
      - label: "HTML 内容"
        name: "body"
        widget: "code"
        default_language: "html"
